name: Build LastMusic APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          npm install -g cordova

          # Create Cordova project
          cordova create cordova-app com.sachin.lastmusic LastMusic
          cd cordova-app

          # Copy your config.xml
          cp ../config.xml ./config.xml

          # Clean and populate www directory with your web files
          rm -rf www/*
          rsync -av --exclude='cordova-app' --exclude='.git' --exclude='.github' ../ www/

          # Find any 192 icon file regardless of leading dot/case and standardize it
          ICON_FOUND=$(find .. -maxdepth 2 -iname "*icon*192*.png" | head -n 1)
          if [ -n "$ICON_FOUND" ]; then
            echo "Found icon at: $ICON_FOUND"
            cp "$ICON_FOUND" ./icon-192.png
            cp "$ICON_FOUND" ./www/icon-192.png
          else
            echo "Icon not found, generating placeholder to prevent build fail..."
            convert -size 192x192 xc:#070b14 ./icon-192.png || touch ./icon-192.png
            cp ./icon-192.png ./www/icon-192.png
          fi

          # Add Android platform & build debug APK
          cordova platform add android
          cordova build android --debug

      - name: Upload LastMusic APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: LastMusic-Debug-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
