name: Build LastMusic Offline APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Clean Web Directory
        run: |
          mkdir -p www
          rsync -av --delete \
            --exclude='www' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            ./ www/

      - name: Install Capacitor & Initialize Android
        run: |
          # Create a guaranteed clean package.json if not present
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          
          # Install matching Capacitor v6 dependencies non-interactively
          npm install --save @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          
          # If an old android directory exists, remove it so cap add generates a fresh one
          rm -rf android
          
          # Add android platform without interactive prompts
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload LastMusic APK
        uses: actions/upload-artifact@v4
        with:
          name: LastMusic-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
